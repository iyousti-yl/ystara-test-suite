# Runs Ystara locally: Postgres, the API, the worker and Mailpit (a local inbox for alert emails).
#   docker compose up -d --build     start everything (web app and API on http://127.0.0.1:4000, inbox on http://127.0.0.1:8025)
#   docker compose up -d postgres migrate    only the database, to run the API or worker with npm on your machine
#   docker compose down              stop (add -v to also delete the database)
#
# Ports are published on 127.0.0.1 only: everything speaks plain http, which is fine on your own
# machine and nowhere else. To use other host ports, set YSTARA_DB_PORT, YSTARA_API_PORT, YSTARA_MAIL_PORT or YSTARA_SMTP_PORT in your
# shell or in .env (the only settings .env may hold: Compose reads that file and can print its values;
# app settings live in .env.local). The API and the worker need the key file .master-key (see README).

# The image is tagged with YSTARA_VERSION (deploy/compose sets it to the checkout's commit on a server), so an
# earlier version's image stays on the machine to go back to. The containers keep no privileges they don't
# need, can't gain any, and run with a small init that passes on signals and reaps child processes.
x-app: &app
  image: ystara:${YSTARA_VERSION:-dev}
  pull_policy: never # built once, by the migrate service below
  init: true
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ystara
      POSTGRES_PASSWORD: ystara # local development only
      POSTGRES_DB: ystara
    ports:
      - "127.0.0.1:${YSTARA_DB_PORT:-55432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ystara -d ystara"]
      interval: 2s
      timeout: 3s
      retries: 30

  # Builds the image all three app services share, then prepares the database and exits.
  # It builds on every `up` (Docker's cache keeps that quick) and never pulls ystara:dev from a registry.
  migrate:
    <<: *app
    pull_policy: build
    build:
      context: .
      args:
        YSTARA_VERSION: ${YSTARA_VERSION:-dev}
    command: ["node", "packages/db/dist/run-migrations.js"]
    environment:
      DATABASE_URL: postgres://ystara:ystara@postgres:5432/ystara
    depends_on:
      postgres:
        condition: service_healthy

  api:
    <<: *app
    command: ["node", "apps/api/dist/server.js"]
    environment:
      DATABASE_URL: postgres://ystara:ystara@postgres:5432/ystara
      API_HOST: 0.0.0.0
      YSTARA_API_PORT: 4000
      MASTER_KEY_FILE: /run/secrets/master_key
      # Behind a proxy (Caddy, nginx), set YSTARA_TRUST_PROXY in .env or the shell: see apps/api/src/server.ts.
      YSTARA_TRUST_PROXY: ${YSTARA_TRUST_PROXY:-}
    ports:
      - "127.0.0.1:${YSTARA_API_PORT:-4000}:4000"
    # The API writes nothing to disk: its files can't be changed, and /tmp is in memory.
    read_only: true
    tmpfs: [/tmp]
    # Healthy once it answers and reaches the database (GET /api/health); Caddy waits for that on a server.
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:4000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 20s
    # Only the key, not .env.local: the API needs nothing else from it here.
    secrets: [master_key]
    depends_on:
      migrate:
        condition: service_completed_successfully

  # Checks connections and runs scans with the Datasphere CLI, logged in with each tenant's technical
  # client (entered with Connect on the tenant page; it opens their secrets with the key in .master-key).
  # A tenant without one is not scanned here ("not connected"). To scan it with your own CLI login for
  # local development, stop this service, run `datasphere login` and then `npm run dev:worker` on your
  # machine with YSTARA_WORKER_MACHINE_LOGIN=1 set in your shell. Imported scans need no worker.
  worker:
    <<: *app
    command: ["node", "apps/worker/dist/main.js"]
    # On a stop, the worker finishes the jobs it is on for up to 45 seconds (apps/worker/src/main.ts) before it is killed.
    stop_grace_period: 60s
    # The Datasphere CLI's files for each job (its login, its command list) are in memory, gone at a restart.
    tmpfs: [/tmp]
    environment:
      DATABASE_URL: postgres://ystara:ystara@postgres:5432/ystara
      MASTER_KEY_FILE: /run/secrets/master_key
      # Alert emails go to Mailpit, never out of your machine; links in them open the app on your machine.
      SMTP_URL: smtp://mailpit:1025
      YSTARA_PUBLIC_URL: http://127.0.0.1:${YSTARA_API_PORT:-4000}
    secrets: [master_key]
    depends_on:
      migrate:
        condition: service_completed_successfully
      mailpit:
        condition: service_started

  # Catches every email the worker sends and shows it at http://127.0.0.1:8025. It sends nothing on.
  # For `npm run dev:worker`, set SMTP_URL=smtp://127.0.0.1:1025 in .env.local to use it too.
  mailpit:
    image: axllent/mailpit:v1.27
    ports:
      - "127.0.0.1:${YSTARA_MAIL_PORT:-8025}:8025"
      - "127.0.0.1:${YSTARA_SMTP_PORT:-1025}:1025"

volumes:
  pgdata:

secrets:
  # The key that encrypts stored secrets, mounted as /run/secrets/master_key in the services that list it.
  # Compose never reads the file for variables, so the key can't show up in its output.
  master_key:
    file: ./.master-key
