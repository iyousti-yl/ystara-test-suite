# Runs Ystara locally: Postgres, the API and the worker.
#   docker compose up -d --build     start everything (web app and API on http://127.0.0.1:4000)
#   docker compose up -d postgres migrate    only the database, to run the API or worker with npm on your machine
#   docker compose down              stop (add -v to also delete the database)
#
# Ports are published on 127.0.0.1 only: there is no sign-in yet. To use other host ports,
# set YSTARA_DB_PORT / YSTARA_API_PORT in your shell or in .env (the only settings .env may hold:
# Compose reads that file and can print its values; app settings live in .env.local).

x-app: &app
  image: ystara:dev
  pull_policy: never # built once, by the migrate service below

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ystara
      POSTGRES_PASSWORD: ystara # local development only
      POSTGRES_DB: ystara
    ports:
      - "127.0.0.1:${YSTARA_DB_PORT:-55432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ystara -d ystara"]
      interval: 2s
      timeout: 3s
      retries: 30

  # Builds the image all three app services share, then prepares the database and exits.
  # It builds on every `up` (Docker's cache keeps that quick) and never pulls ystara:dev from a registry.
  migrate:
    <<: *app
    pull_policy: build
    build: .
    command: ["node", "packages/db/dist/run-migrations.js"]
    environment:
      DATABASE_URL: postgres://ystara:ystara@postgres:5432/ystara
    depends_on:
      postgres:
        condition: service_healthy

  api:
    <<: *app
    command: ["node", "apps/api/dist/server.js"]
    environment:
      DATABASE_URL: postgres://ystara:ystara@postgres:5432/ystara
      API_HOST: 0.0.0.0
      YSTARA_API_PORT: 4000
    ports:
      - "127.0.0.1:${YSTARA_API_PORT:-4000}:4000"
    depends_on:
      migrate:
        condition: service_completed_successfully

  # Scans run here with the Datasphere CLI. Until the connection wizard stores tenant credentials,
  # the container has no CLI login: to scan a tenant, stop this service and run `npm run dev:worker`
  # on your machine, where `datasphere login` works. Imported scans need no worker.
  worker:
    <<: *app
    command: ["node", "apps/worker/dist/main.js"]
    environment:
      DATABASE_URL: postgres://ystara:ystara@postgres:5432/ystara
    depends_on:
      migrate:
        condition: service_completed_successfully

volumes:
  pgdata:
